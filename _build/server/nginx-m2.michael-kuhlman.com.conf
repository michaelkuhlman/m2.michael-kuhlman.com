# m2.michael-kuhlman.com - Magento 2 (Mage-OS 3.5) portfolio demo store
# Docroot /var/www/m2.michael-kuhlman.com (owner/system user m2, git: ~/bin/m2git, see its CLAUDE.md).
# PHP: pool [m2] /etc/php/8.3/fpm/pool.d/m2.conf. Magento rules: /etc/nginx/snippets/m2_magento.conf.
# Cert: certbot webroot /var/www/letsencrypt, deploy hook reloads nginx. DNS: Cloudflare zone michael-kuhlman.com, proxied.

upstream m2_fastcgi { server unix:/run/php/php8.3-fpm-m2.sock; }

server {
    listen 80;
    listen [::]:80;
    server_name m2.michael-kuhlman.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://m2.michael-kuhlman.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name m2.michael-kuhlman.com;

    ssl_certificate     /etc/letsencrypt/live/m2.michael-kuhlman.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/m2.michael-kuhlman.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/m2.michael-kuhlman.access.log;
    error_log  /var/log/nginx/m2.michael-kuhlman.error.log;

    include snippets/cloudflare-realip.conf;
    real_ip_header CF-Connecting-IP;

    # Own header set (stops the looser global conf.d/security.conf set being inherited; Magento sends its own CSP).
    # Demo store: keep it out of search engines.
    include snippets/m2_headers.conf;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    # never serve dotfiles (except .well-known) or backup copies
    location ~ /\.(?!well-known) { return 404; }
    location ~* \.(old|bak|orig|production|env|sqlite|db|sql)$ { return 404; }

    # ShopperUx JSON endpoints: rate-limited, then handed to Magento like everything else
    location ^~ /shopux/ {
        limit_req zone=m2_ux burst=40 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    set $MAGE_ROOT /var/www/m2.michael-kuhlman.com;
    set $MAGE_MODE production;
    include snippets/m2_magento.conf;
}
