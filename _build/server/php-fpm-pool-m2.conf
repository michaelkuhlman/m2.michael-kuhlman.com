; Magento 2 demo store - m2.michael-kuhlman.com (docroot /var/www/m2.michael-kuhlman.com, git ~/bin/m2git)
; Runs as its own system user m2. nginx (www-data, member of group m2) talks to it over the socket.
[m2]
user = m2
group = m2
listen = /run/php/php8.3-fpm-m2.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 1000
request_terminate_timeout = 600
php_admin_value[memory_limit] = 1G
php_admin_value[max_execution_time] = 600
php_admin_value[upload_max_filesize] = 32M
php_admin_value[post_max_size] = 64M
php_admin_value[realpath_cache_size] = 10M
php_admin_value[realpath_cache_ttl] = 7200
php_admin_value[zlib.output_compression] = off
php_admin_value[date.timezone] = America/Los_Angeles
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php/php8.3-fpm-m2-error.log
