# m2.michael-kuhlman.com: limiter for the ShopperUx JSON endpoints (/shopux/search/suggest runs a search per
# distinct query; /shopux/product/cards renders product cards). A person typing makes a few requests a second;
# this only stops scripted floods. $binary_remote_addr is the real visitor (real_ip_header CF-Connecting-IP in
# the vhost). limit_req_status 429 is set globally in kp-ratelimit.conf.
limit_req_zone $binary_remote_addr zone=m2_ux:10m rate=8r/s;
